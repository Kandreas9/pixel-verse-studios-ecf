services:
    app:
        env_file:
            - .env.production
        build:
            context: .
            dockerfile: ./docker/prod/php/Dockerfile
        container_name: pixelverse_app
        restart: unless-stopped
        volumes:
            - storage:/var/www/html/storage
        networks:
            - laravel
        depends_on:
            - mysql
            - mailpit
            - mongodb

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        volumes:
            - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./public:/var/www/html/public
        depends_on:
            - app
        networks:
            - laravel

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - laravel

    mongodb:
        image: mongo:7.0
        environment:
            - 'MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}'
            - 'MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}'
        volumes:
            - 'mongodb_data:/data/db'
        ports:
            - '${FORWARD_MONGODB_PORT:-27017}:27017'
        networks:
            - laravel

    queue:
        build:
            context: .
            dockerfile: ./docker/prod/php/Dockerfile
        restart: unless-stopped
        command: php artisan queue:work --tries=3 --timeout=90
        depends_on:
            - mysql
            - mongodb
        networks:
            - laravel

    traefik:
        image: traefik:v3.0
        command:
            - '--providers.docker=true'
            - '--entrypoints.web.address=:80'
            - '--entrypoints.websecure.address=:443'
            - '--certificatesresolvers.le.acme.httpchallenge.entrypoint=web'
            - '--certificatesresolvers.le.acme.email=you@yourdomain.com'
            - '--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json'
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.app.rule=Host(`localhost`)'
            - 'traefik.http.routers.app.entrypoints=websecure'
            - 'traefik.http.routers.app.tls.certresolver=letsencrypt'
            - 'traefik.http.services.app.loadbalancer.server.port=80'
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - letsencrypt:/letsencrypt
        networks:
            - laravel

volumes:
    mysql_data:
    mongodb_data:
    storage:
    letsencrypt:

networks:
    laravel:
